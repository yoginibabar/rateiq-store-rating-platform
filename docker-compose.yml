services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rateiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["rateiq_pg:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rateiq?schema=public
      JWT_SECRET: change-this-development-secret
      CLIENT_URL: http://localhost:5173
      PORT: 5000
    depends_on: [postgres]
    ports: ["5000:5000"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  rateiq_pg:
